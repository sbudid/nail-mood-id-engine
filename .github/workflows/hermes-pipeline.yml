name: Hermes Nail Mood Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Main Topic (e.g., Gel Nails)'
        required: true
        default: 'Gel Nails'
      max_articles:
        description: 'Number of articles to generate'
        required: false
        default: '1'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Hermes Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}
        run: |
          python -m src.core.orchestrator \
            --topic "${{ github.event.inputs.topic }}" \
            --max ${{ github.event.inputs.max_articles }}

      - name: Upload Publishing Package
        uses: actions/upload-artifact@v4
        with:
          name: nail-mood-publishing-package
          path: data/Published/
