name: Hermes Nail Mood Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Main Topic (e.g., Gel Nails, Press On Nails, Cat Eye Nails)'
        required: true
        default: 'Gel Nails'
      max_articles:
        description: 'Number of articles to generate'
        required: false
        default: '1'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt pyyaml requests

      - name: Run Nail Mood Engine
        env:
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python -m src.core.orchestrator \
            --topic "${{ github.event.inputs.topic }}" \
            --max ${{ github.event.inputs.max_articles }}

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: nail-mood-output
          path: data/Published/
